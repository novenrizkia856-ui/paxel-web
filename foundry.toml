[profile.default]
src = "src"
out = "out"
libs = ["lib"]

# Pinned compiler. The target network is chosen by the operator at deploy time, so the bytecode
# targets Shanghai, which every mainstream EVM chain supports.
solc = "0.8.28"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 512

[rpc_endpoints]
deploy = "${RPC_URL}"

[lint]
# `registry` on PaxelEventLog is a public getter read by name. Renaming it to REGISTRY would
# change the ABI the web frontend calls.
exclude_lints = ["screaming-snake-case-immutable"]

[profile.ci.fuzz]
runs = 1024
